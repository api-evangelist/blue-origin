- id: vercel-checkpoint
  media_type: text/html
  shape: HTML interstitial titled "Vercel Security Checkpoint"
  surfaces: [https://www.blueorigin.com, https://blueorigin.com]
problems:
- id: ucp-invalid-profile-url
  status: 422
  envelope: jsonrpc
  code: -32001
  title: UCP discovery failed
  data_code: invalid_profile_url
  detail: 'Unable to fetch agent profile: Missing profile uri'
  remediation: >-
    Supply meta.ucp-agent.profile as a resolvable agent-profile URI on the UCP MCP
    request, or use the non-UCP MCP endpoint at /api/mcp, which answers anonymously.
  observed_at: https://shop.blueorigin.com/api/ucp/mcp
- id: rate-limited-mcp
  status: 429
  envelope: jsonrpc
  title: Rate limited
  detail: The MCP endpoint is rate limited per IP.
  remediation: Back off and retry with exponential delay (documented in llms.txt).
