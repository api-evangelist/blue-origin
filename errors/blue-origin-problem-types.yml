format: mixed
note: >-
  Blue Origin publishes no error reference and no OpenAPI, so nothing here is derived
  from a spec — every entry is an error a Blue Origin host actually returned during
  contract discovery. Two envelopes are in play: JSON-RPC 2.0 error objects on the
  Shopify MCP/UCP endpoints, and Salesforce platform error strings on the customer and
  data portals. Neither uses RFC 9457 application/problem+json.
envelopes:
