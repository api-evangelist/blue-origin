- id: missing-oauth-token
  status: 403
  envelope: salesforce-platform
  code: Missing_OAuth_Token
  title: Missing OAuth token
  detail: An OAuth bearer token is required for this Salesforce portal resource.
  remediation: >-
    Complete the authorization-code flow at
    https://payloads.blueorigin.com/services/oauth2/authorize and present the bearer
    token; access is limited to provisioned Blue Origin portal users.
  observed_at: https://payloads.blueorigin.com/services/oauth2/userinfo
- id: portal-unauthorized
  status: 401
  envelope: salesforce-platform
  title: Unauthorized
  detail: >-
    The Experience Cloud community returns 401 for every path outside its anonymous
    discovery surface, including /.well-known/security.txt, /llms.txt and /openapi.json.
  remediation: Authenticate as a provisioned portal user.
  observed_at: [https://payloads.blueorigin.com/openapi.json, https://bodp.blueorigin.com/openapi.json]
- id: portal-not-found
  status: 404
  envelope: salesforce-platform
  title: Not found
  detail: Path not routed by the Experience Cloud community.
  observed_at: https://payloads.blueorigin.com/api-docs
- id: corporate-site-bot-wall
  status: 429
  envelope: vercel-checkpoint
  title: Vercel Security Checkpoint
  detail: >-
    www.blueorigin.com and blueorigin.com return HTTP 429 with an HTML challenge page to
    every non-browser request, including /robots.txt. This is a bot wall, not a rate
    limit an agent can back off from — no Retry-After was observed and repeated,
    well-spaced requests with full browser header sets were also refused.
  remediation: >-
    None available to an automated client. The corporate site is unreadable by agents;
    machine-readable Blue Origin content must be taken from shop.blueorigin.com.
  observed_at: [https://www.blueorigin.com/robots.txt, https://www.blueorigin.com/llms.txt]
