  media_type: application/json
  shape: '{"jsonrpc":"2.0","id":<id>,"error":{"code":<int>,"message":<string>,"data":{...}}}'
  surfaces: [https://shop.blueorigin.com/api/ucp/mcp, https://shop.blueorigin.com/api/mcp]
- id: salesforce-platform
