notes: >-
  Blue Origin's corporate site (blueorigin.com / www.blueorigin.com) is hosted on Vercel
  behind a "Vercel Security Checkpoint" that answers HTTP 429 to every non-browser
  request — including /robots.txt — so no /.well-known/ path on the corporate host could
  be evaluated. Those rows are recorded as blocked-429, NOT as 404, so a later round does
  not mistake a bot wall for an absence. The real documents all live on two vendor-hosted
  surfaces bound to blueorigin.com hosts: the Shopify storefront (shop.blueorigin.com),
  which serves an llms.txt, an agents.md, a UCP merchant profile, OIDC/OAuth 2.0
  authorization-server metadata and RFC 9728 protected-resource metadata; and the two
  Salesforce Experience Cloud portals (payloads, bodp), which serve OIDC discovery. No
  RFC 9116 security.txt and no A2A agent card was found on any Blue Origin host.
