apis:
- name: Blue Origin Shop MCP Server
  description: 'The Blue Origin Shop storefront exposes an anonymous Model Context Protocol
    endpoint at https://shop.blueorigin.com/api/mcp. A live tools/list returned five
    tools with full JSON Schema draft 2020-12 input schemas: search_catalog, get_product_details,
    get_cart, update_cart and search_shop_policies_and_faqs. Responses conform to Universal
    Commerce Protocol capabilities (dev.ucp.shopping.catalog.search, .catalog.lookup,
    .cart, .checkout, .fulfillment, .discount, .order). This is Shopify''s agentic commerce
    surface bound to Blue Origin''s store — it is not a Blue Origin space or launch
    API. Checkout requires contemporaneous buyer approval; the endpoint is rate limited
    per IP.'
  humanURL: https://shop.blueorigin.com/agents.md
  baseURL: https://shop.blueorigin.com/api/mcp
  tags:
  - MCP
  - Commerce
  - Catalog
  - Cart
  - Agents
  properties:
  - type: MCPServer
    url: mcp/blue-origin-mcp.yml
  - type: LLMsTxt
    url: llms/blue-origin-shop-llms.txt
  - type: x-evidence
    url: https://shop.blueorigin.com/api/mcp
- name: Blue Origin Shop Storefront JSON
  description: 'The read-only JSON surface of the Blue Origin Shop Shopify storefront,
    documented by the store''s own llms.txt/agents.md: GET /products.json and GET /collections/{handle}/products.json
    return the product catalogue, GET /products/{handle}.json returns a single product,
    and GET /search?q={query}&type=product runs storefront search. No authentication
    is required for these reads and no OpenAPI description is published for them. A
    UCP merchant profile is served at /.well-known/ucp and an agentic-discovery sitemap
    at /sitemap_agentic_discovery.xml.'
  humanURL: https://shop.blueorigin.com/collections/all
  baseURL: https://shop.blueorigin.com
  tags:
  - Commerce
  - Catalog
  - Products
  - JSON
  properties:
  - type: WellKnown
    url: well-known/blue-origin-well-known.yml
  - type: x-evidence
    url: https://shop.blueorigin.com/products.json
- name: Blue Origin Customer Portal (Payloads) Platform API
  description: 'payloads.blueorigin.com is Blue Origin''s customer portal for payload
    customers, running on Salesforce Experience Cloud. Blue Origin publishes no documentation
    or machine-readable description for it, but the host answers anonymously on the
    Salesforce platform discovery surface: /services/data lists 37 REST API versions
    (v31.0 through v67.0, Summer ''26), /.well-known/openid-configuration returns full
    OIDC discovery metadata, and /id/keys serves the JWKS. Every business resource is
    OAuth-gated — an unauthenticated call to /services/oauth2/userinfo returns 403 Missing_OAuth_Token
    and /openapi.json returns 401.'
  humanURL: https://payloads.blueorigin.com/
  baseURL: https://payloads.blueorigin.com/services/data/v67.0
  tags:
  - Payloads
  - Customer Portal
  - Salesforce
  - OAuth
  properties:
  - type: OpenIDConnect
    url: well-known/blue-origin-payloads-openid-configuration.json
  - type: x-evidence
    url: https://payloads.blueorigin.com/services/data
- name: Blue Origin Data Portal (BODP) Platform API
  description: 'bodp.blueorigin.com is the Blue Origin Data Portal, a second Salesforce
    Experience Cloud community on the same Salesforce org as the payloads customer portal.
    Like that portal it publishes no documentation and no machine-readable API description,
    while answering anonymously on the Salesforce platform discovery surface: /services/data
    lists REST API versions v31.0 through v67.0, /.well-known/openid-configuration returns
    OIDC discovery metadata, and /id/keys serves the JWKS. All data access is OAuth-gated
    behind a login wall.'
  humanURL: https://bodp.blueorigin.com/
  baseURL: https://bodp.blueorigin.com/services/data/v67.0
  tags:
  - Data Portal
  - Salesforce
  - OAuth
  properties:
  - type: OpenIDConnect
    url: well-known/blue-origin-bodp-openid-configuration.json
  - type: x-evidence
    url: https://bodp.blueorigin.com/services/data
