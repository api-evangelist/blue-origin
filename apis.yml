aid: blue-origin
name: Blue Origin
description: 'Blue Origin is an American private aerospace manufacturer and spaceflight
  services company founded in 2000 by Jeff Bezos and headquartered in Kent, Washington.
  It builds and flies the reusable New Shepard suborbital vehicle, the heavy-lift New
  Glenn orbital launch vehicle, the BE-3 and BE-4 rocket engines, the Blue Moon lunar
  lander and the Blue Ring orbital transfer vehicle, and it owns Honeybee Robotics.
  Blue Origin publishes no public developer portal, no API documentation and no machine-readable
  API description for any of its space products; customer, payload and supplier relationships
  run through authenticated portals — payloads.blueorigin.com and bodp.blueorigin.com
  on Salesforce Experience Cloud, and supplierportal.blueorigin.com on AWS GovCloud.
  The only genuinely agent-addressable surface on a blueorigin.com host is the Blue
  Origin Shop, a Shopify storefront that publishes a real llms.txt and agents.md, a
  Universal Commerce Protocol (UCP) merchant profile, RFC 9728 protected-resource metadata,
  and an anonymous MCP server at /api/mcp exposing five tools. The corporate site itself
  sits behind a Vercel Security Checkpoint that answers HTTP 429 to every non-browser
  request, including /robots.txt.'
